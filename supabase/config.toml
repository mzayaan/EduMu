# EduMU — Supabase local configuration.
#
# Required by `supabase start`. Generated to match the linked project
# (wdwtapdmdgdcvbifbeiz). If your CLI version rejects any key here, regenerate
# with `npx supabase init --force` and re-apply the two non-default choices
# noted below.

project_id = "edumu"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# NON-DEFAULT 1: the custom access token hook. RLS reads school_id, person_id,
# roles and capabilities from the JWT, so without this every policy denies and
# the whole suite fails.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/app/custom_access_token_hook"

# NON-DEFAULT 2: leaked password protection. Off by default; on before any pilot.
[auth.password]
# min_length = 8

[analytics]
enabled = false

[edge_runtime]
enabled = true
