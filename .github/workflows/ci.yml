name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The SQL parity suite is generated from the shared fixture. If it is
      # stale, the TypeScript and SQL implementations of the attendance
      # arithmetic may have silently diverged.
      - name: Parity suite is up to date
        run: |
          npm run gen:parity
          git diff --exit-code supabase/tests/_generated_parity.sql \
            || (echo "::error::_generated_parity.sql is stale — run 'npm run gen:parity'" && exit 1)

  database:
    name: Migrations and RLS suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # A real Postgres with the migrations applied from scratch. This also
      # proves the migrations replay cleanly on an empty database, which is the
      # only thing standing between us and an unrecoverable schema.
      - name: Start Supabase
        run: supabase start

      - name: Verify migrations replay cleanly
        run: supabase db reset

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # The RLS suites are the gate. A leak here exposes marks, medical notes
      # or discipline records, so a red suite must block the merge.
      - name: Run SQL test suites
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/run-sql-tests.mjs

      - name: Security advisors
        run: supabase inspect db outliers || true
